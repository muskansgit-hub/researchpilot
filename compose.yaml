services:
  researchpilot:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATA_DIR: /app/data
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
    volumes:
      - research-data:/app/data
volumes:
  research-data:
